# Netlify — عَمارتي / Next.js + Prisma
# https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/overview/

[build]
  command = "npm run build:netlify"
  # الإضافة تتحقق من مخرجات Next.js هنا (قبل onPostBuild). جذر المستودع مرفوض.
  # لا تستخدم .netlify/output/public — ذلك ليس مسار مخرجات @netlify/plugin-nextjs v5.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # مطلوب في لوحة Netlify → Environment variables مع اختيار **All scopes** (أو Builds + Functions + Post processing):
#   DATABASE_URL   — يُفضّل رابط Neon **pooling** للتشغيل (يحتوي غالباً على -pooler)
#   DIRECT_URL     — اختياري لكن مُستحسن: رابط Neon **direct** لـ prisma migrate في البناء (نفس لوحة Neon → Connection details)
#   AUTH_SECRET    — 32+ محرف عشوائي (مطلوب لجلسة تسجيل الدخول في الـ Functions)
#   بعد تغيير binaryTargets في prisma/schema شغّل نشراً كاملاً (ليس «retry deploy» فقط إن فشل generate).
  #
  # شائع: وضع المتغيرات على «Builds» فقط فينتج البناء نجاحاً لكن التسجيل يفشل عند التشغيل — فعّلها للـ Functions أيضاً.
  #
  # أو مرة واحدة من جهازك: npx netlify login && npx netlify link && npm run netlify:env-import
  #
  # إن المتغير السرّي لا يصل لـ Build وأردت تجاوز فحص البناء (⚠ مخاطرة): ضع متغّراً غير سريّ قيمته true:
  #   NETLIFY_BUILD_NO_DATABASE
  # ثم اضبط DATABASE_URL لتشغيل الموقع (Functions) وأكمل: npx prisma migrate deploy ضد Neon من جهازك.

[[plugins]]
  package = "@netlify/plugin-nextjs"
