# Netlify — عَمارتي / Next.js + Prisma
# https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/overview/

[build]
  command = "npm run build:netlify"
  # الإضافة تتحقق من مخرجات Next.js هنا (قبل onPostBuild). جذر المستودع مرفوض.
  # لا تستخدم .netlify/output/public — ذلك ليس مسار مخرجات @netlify/plugin-nextjs v5.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # عيّن في لوحة Netlify (Build + Runtime/Functions) بدون استثناء:
  #   DATABASE_URL = postgresql://... (Neon/Supabase وغيرها)
  #   AUTH_SECRET = نص عشوائي 32+ محرف
  # لا تضع هنا DATABASE_URL وهمي؛ `prisma migrate deploy` يحتاج اتصالاً حقيقياً أثناء البناء.

[[plugins]]
  package = "@netlify/plugin-nextjs"
