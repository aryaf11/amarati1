services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: amarati
      POSTGRES_PASSWORD: amarati
      POSTGRES_DB: amarati
    ports:
      - "5432:5432"
    volumes:
      - amarati_pgdata:/var/lib/postgresql/data

volumes:
  amarati_pgdata:
